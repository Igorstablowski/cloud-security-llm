# Trabalho prático (mestrado) — app didático + Ollama local.
# Independente do docker-compose.yml da raiz do projeto (CredSim v1/v2):
# portas diferentes de propósito para poder rodar os dois ao mesmo tempo.
#
#   cp .env.example .env
#   docker compose up --build
#   App    -> http://localhost:8020
#   Ollama -> http://localhost:11435  (debug/inspeção manual; o app usa a rede interna)
#
# As portas ficam presas a 127.0.0.1 DE PROPÓSITO: o app é vulnerável por desenho e a API do
# Ollama não tem autenticação. Não troque para 0.0.0.0 (nem tire o 127.0.0.1) numa rede
# compartilhada, como o Wi-Fi da sala.
#
# Se o serviço `ollama-pull` falhar ou demorar demais, baixe os modelos manualmente:
#   docker compose exec ollama ollama pull ${OLLAMA_MODEL:-llama3.2:3b}
#   docker compose exec ollama ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.2:3b} && ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]

  app:
    build: ./app
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-60}
    ports:
      - "127.0.0.1:8020:8000"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_models:
